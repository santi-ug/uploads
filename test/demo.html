<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch plan</title><style>:root{color-scheme:light dark}body{background:#fff;color:#171717;font:16px/1.6 system-ui;margin:0;padding:32px;max-width:760px}h1{font-size:28px;line-height:1.2;letter-spacing:-.8px}small{color:#676767}button{font:inherit;padding:10px 14px;background:transparent;color:inherit;border:1px solid #aaa;border-radius:6px;min-height:44px}@media(prefers-color-scheme:dark){body{background:#000;color:#fff}small{color:#aaa}}</style></head><body><small>RELEASE · VERSION 3</small><h1>A smaller first release</h1><p>Start with the core workflow. Leave team settings for a later release.</p><p>Invite the first 20 customers and collect their feedback before opening signups.</p><p>Next: finish onboarding and test the invite flow.</p><button id="details">Show launch checklist</button><ul id="checklist" hidden><li>Finish onboarding</li><li>Test invite flow</li></ul><script>document.querySelector('#details').addEventListener('click',()=>{const list=document.querySelector('#checklist');list.hidden=!list.hidden;document.querySelector('#details').textContent=list.hidden?'Show launch checklist':'Hide launch checklist'})</script></body></html>
